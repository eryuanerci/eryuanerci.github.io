site_name: XuYan
site_description: XuYan 的个人网站
site_url: https://eryuanerci.github.io/   # 网站地址（用于生成站点地图 sitemap）

# 构建钩子：自动生成「最新文章」「上一篇/下一篇」和 sitemap.xml
hooks:
  - docs/hooks.py

theme:
  name: material
  custom_dir: docs/overrides   # 自定义模板目录（当前放 404 页面模板）
  language: zh
  # 使用系统自带字体，避免下载国外字体导致打开变慢
  font: false
  # 浏览器标签页小图标 + 顶栏左上角图标
  favicon: assets/images/favicon.svg
  logo: assets/images/favicon.svg
  # 浅色 / 深色两套皮肤，顶部出现切换按钮（夜间模式）
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant    # 页面切换不整页刷新（即时加载）
    - navigation.top        # 返回顶部按钮
    - content.code.copy     # 代码块右上角复制按钮

plugins:
  - search
  - tags:
      tags_file: tags.md   # 文章标签，汇总到 tags.md 这个页面

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eryuanerci

extra_css:
  - assets/css/extra.css  # 主页粒子动效、名牌、文章统计的样式

extra_javascript:
  - assets/js/stats.js    # 访问统计脚本
  - assets/js/giscus.js   # 留言区脚本
  - assets/js/extra.js    # 主页动效脚本（打字机、粒子、名牌、文章统计）

nav:
  - 主页: index.md
  - 课程: course/index.md
  - 随笔: essay/index.md
  - 日记: diary/index.md
  - 友链: friends/index.md
  - 关于: about/index.md
